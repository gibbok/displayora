name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Intel application
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Verify runner architecture
        run: test "$(uname -m)" = x86_64

      - name: Build, smoke test, and package
        run: make ci

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Displayora-Intel.zip
          path: build/Displayora-Intel.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download applications
        uses: actions/download-artifact@v8
        with:
          pattern: Displayora-*.zip
          path: dist
          merge-multiple: true

      - name: Verify release files
        run: |
          test -f dist/Displayora-Intel.zip
          unzip -tq dist/Displayora-Intel.zip
          unzip -Z1 dist/Displayora-Intel.zip | grep -Fx 'Displayora.app/Contents/MacOS/Displayora'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Displayora-Intel.zip \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Displayora $GITHUB_REF_NAME"
